 if(zoom){const w=Math.max(1300,n.width*2.2),h=w*canvas.clientHeight/canvas.clientWidth;view=[n.x+70+n.width/2-w/2,n.y+265+n.height/2-h/2,w,h];draw()}status.textContent=n.id+'：已高亮 '+connected.length+' 条直接关系；其他类型仍保留在同一画布。';document.getElementById('search').value=n.id;return true}
function reset(){clear();view=original.slice();draw();status.textContent='全部显示：47 个项目类型 + RuntimeException（JDK），95 条关系；PDF / SVG 也各为单张完整图。'}
function zoom(f,px=.5,py=.5){const w=Math.min(original[2]*2,Math.max(650,view[2]*f)),h=w*view[3]/view[2],rx=view[0]+view[2]*px,ry=view[1]+view[3]*py;view=[rx-w*px,ry-h*py,w,h];draw()}
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(e.deltaY>0?1.16:1/1.16,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,view:view.slice()};wasDrag=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)wasDrag=true;if(wasDrag){view=[drag.view[0]-dx*drag.view[2]/canvas.clientWidth,drag.view[1]-dy*drag.view[3]/canvas.clientHeight,drag.view[2],drag.view[3]];draw()}});
canvas.addEventListener('pointerup',e=>{drag=null;if(!wasDrag){const hit=document.elementFromPoint(e.clientX,e.clientY),node=hit&&hit.closest('g[id^="class-"]');if(node)select(node.id.slice(6),false)}});
document.getElementById('find').onclick=()=>select(document.getElementById('search').value.trim(),true);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')select(e.target.value.trim(),true)});document.getElementById('reset').onclick=reset;document.getElementById('plus').onclick=()=>zoom(1/1.5);document.getElementById('minus').onclick=()=>zoom(1.5);
window.sdfms={select,reset,graph};
</script></html>
